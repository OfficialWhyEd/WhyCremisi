<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHYCREMISI // TACTICAL MASTERING ENGINE</title>
    <link rel="icon"             type="image/svg+xml"  href="/favicon.svg">
    <link rel="icon"             type="image/png" sizes="96x96"   href="/favicon-96x96.png">
    <link rel="icon"             type="image/png" sizes="48x48"   href="/favicon-48x48.png">
    <link rel="icon"             type="image/png" sizes="32x32"   href="/favicon-32x32.png">
    <link rel="icon"             type="image/png" sizes="16x16"   href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180"                  href="/favicon-180x180.png">
    <meta name="theme-color"     content="#000000">
    <link rel="manifest"         href="/site.webmanifest">
    <!-- I font stanno nel bundle, non su internet.

         Prima venivano da fonts.googleapis.com. Il plugin gira dentro una
         WebView2 in una DAW, spesso su macchine di studio senza rete o
         dietro un firewall: senza connessione il testo ripiegava sul sans
         di sistema e — molto peggio — il font delle icone non arrivava,
         quindi ogni icona si mostrava come la sua legatura testuale
         ("play_arrow", "equalizer", "priority_high") sparsa per
         l'interfaccia. La specifica chiede esplicitamente che tutto
         funzioni offline: adesso i file sono in /fonts e vengono caricati
         dal disco. Vedi @font-face in src/index.css. -->
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="preload" href="/fonts/material-symbols.woff2" as="font" type="font/woff2" crossorigin/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
